<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'Montserrat',sans-serif;color:#fff;
  background:
    radial-gradient(circle at 85% 8%, rgba(255,214,0,.55) 0, rgba(255,214,0,0) 32%),
    radial-gradient(circle at 5% 55%, rgba(0,229,255,.45) 0, rgba(0,229,255,0) 35%),
    radial-gradient(circle at 95% 85%, rgba(255,61,127,.7) 0, rgba(255,61,127,0) 40%),
    linear-gradient(160deg,#3b0a8f 0%,#6a11cb 40%,#c2187a 78%,#ff5a1f 100%);
  position:relative}
/* subtle grid texture */
body:before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:54px 54px;mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
/* road stripes */
.road{position:absolute;left:-100px;right:-100px;bottom:250px;height:16px;transform:rotate(-6deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 80px,transparent 80px 130px)}

.top{position:absolute;top:56px;left:60px;right:60px;text-align:center}
.tag{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#6a11cb;
  font-weight:800;font-size:26px;letter-spacing:3px;padding:14px 30px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tag i{width:14px;height:14px;border-radius:50%;background:#00d26a;display:inline-block;box-shadow:0 0 0 5px rgba(0,210,106,.25)}
h1{margin-top:34px;font-weight:900;line-height:.95;text-transform:uppercase;letter-spacing:-1px}
h1 .l1{display:block;font-size:132px;color:#FFE600;
  text-shadow:0 8px 0 #b3007a, 0 18px 40px rgba(0,0,0,.35)}
h1 .l2{display:inline-block;margin-top:22px;font-size:62px;line-height:1.02;background:#fff;color:#2a0866;
  padding:18px 46px 20px;border-radius:18px;transform:rotate(-2deg);
  box-shadow:0 14px 0 #00E5FF, 0 24px 50px rgba(0,0,0,.3)}
h1 .l2 b{color:#e0157a}
.sub{margin-top:44px;font-size:36px;font-weight:700;color:#fff}
.sub span{color:#FFE600}

/* 3D app stage */
.stage{position:absolute;top:705px;left:0;right:0;height:330px;perspective:1400px;display:flex;justify-content:center}
.ring{transform-style:preserve-3d;display:flex;gap:34px;transform:rotateX(14deg)}
.app{width:210px;height:210px;border-radius:52px;display:flex;align-items:center;justify-content:center;
  font-weight:900;position:relative;
  box-shadow:0 30px 50px rgba(20,0,60,.55), inset 0 -8px 0 rgba(0,0,0,.18), inset 0 6px 0 rgba(255,255,255,.25)}
.app:after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(140deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 45%)}
.app .lbl{display:none;position:absolute;bottom:-62px;left:0;right:0;text-align:center;font-size:26px;font-weight:800;color:#fff;letter-spacing:1px}
.a1{background:#000;color:#fff;font-size:68px;letter-spacing:-2px;transform:rotateY(22deg) translateZ(-20px)}
.a2{background:#FFDD00;color:#111;font-size:118px;letter-spacing:-6px;transform:rotateY(8deg) translateZ(30px)}
.a3{background:#C1F11D;color:#141414;font-size:44px;letter-spacing:-1.5px;transform:rotateY(-8deg) translateZ(30px)}
.a4{background:#EA1D2C;color:#fff;font-size:58px;letter-spacing:-1px;transform:rotateY(-22deg) translateZ(-20px)}
.a3 small{font-weight:900}

.roda{position:absolute;top:650px;left:0;right:0;text-align:center;font-size:24px;font-weight:800;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.roda:before,.roda:after{content:"";display:inline-block;width:70px;height:3px;background:rgba(255,255,255,.6);vertical-align:middle;margin:0 18px;border-radius:2px}
/* benefits */
.benefits{position:absolute;top:985px;left:60px;right:60px;display:flex;gap:20px}
.b{flex:1;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:26px;
  padding:22px 18px;text-align:center;backdrop-filter:blur(6px)}
.b svg{width:52px;height:52px;margin-bottom:10px}
.b p{font-size:25px;font-weight:800;line-height:1.15}

/* CTA */
.cta{position:absolute;left:60px;right:60px;bottom:46px;height:118px;border-radius:999px;
  background:linear-gradient(90deg,#FFE600,#FFB800);color:#2a0866;display:flex;align-items:center;justify-content:center;gap:22px;
  font-size:48px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  box-shadow:0 12px 0 #c26a00, 0 26px 50px rgba(0,0,0,.35)}
.cta .arrow{width:70px;height:70px;border-radius:50%;background:#2a0866;display:flex;align-items:center;justify-content:center}
.cta .arrow svg{width:38px;height:38px}
</style>
</head>
<body>

<div class="top">
  <div class="tag"><i></i>CRÉDITO RÁPIDO E SEGURO</div>
  <h1>
    <span class="l1">Empréstimo</span>
    <span class="l2">para <b>motoristas</b><br>de aplicativo</span>
  </h1>
  <p class="sub">Dinheiro na conta para você <span>acelerar seus ganhos!</span></p>
</div>

<p class="roda">Para quem roda com</p>
<div class="stage">
  <div class="ring">
    <div class="app a1">Uber<span class="lbl">UBER</span></div>
    <div class="app a2">99<span class="lbl">99</span></div>
    <div class="app a3">inDrive<span class="lbl">INDRIVE</span></div>
    <div class="app a4">iFood<span class="lbl">IFOOD</span></div>
  </div>
</div>

<div class="benefits">
  <div class="b">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FFE600" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <p>Aprovação<br>rápida</p>
  </div>
  <div class="b">
    <svg viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 10v5M18 10v5"/></svg>
    <p>Dinheiro<br>via PIX</p>
  </div>
  <div class="b">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7CFF6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <p>Sem<br>burocracia</p>
  </div>
  <div class="b">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FF8AD0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <p>Parcelas<br>flexíveis</p>
  </div>
</div>

<div class="cta">Simule agora
  <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#FFE600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</div>
</body>
</html>
